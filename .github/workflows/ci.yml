name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # The tool should also pass its own audit. Eating our own dog food.
      - run: node bin/hallucinot.js --range HEAD~1..HEAD --warn-only
        if: github.event_name == 'push'
